<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اطلب من elmo3ez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coal:#1c1815; --coal-2:#241f1b; --ember:#bf5b2e; --ember-bright:#e07a3f;
    --brass:#b9924f; --cream:#ede6da; --cream-dim:#b9b0a1; --line:#3a332c;
    --ok:#7c9a6f; --err:#c15c4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--coal); color:var(--cream); font-family:'IBM Plex Sans Arabic',sans-serif; padding:24px 16px 60px;}
  .wrap{max-width:520px; margin:0 auto;}
  h1{font-family:'Rakkas',serif; font-size:32px; font-weight:400; margin:10px 0 6px;}
  .sub{color:var(--cream-dim); font-size:14px; margin-bottom:24px;}
  .card{background:var(--coal-2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--brass); margin-bottom:6px; font-weight:600;}
  input, select{
    width:100%; background:#17130f; border:1px solid var(--line); border-radius:9px;
    color:var(--cream); font-family:inherit; font-size:15px; padding:11px 12px; margin-bottom:14px; outline:none;
  }
  input:focus, select:focus{border-color:var(--brass);}
  .item-row{display:flex; gap:8px; margin-bottom:10px; align-items:center;}
  .item-row select{flex:2; margin-bottom:0;}
  .item-row input{flex:1; margin-bottom:0;}
  .item-row button{flex-shrink:0;}
  .remove-btn{background:none; border:1px solid var(--line); color:var(--err); border-radius:8px; width:38px; height:38px; cursor:pointer; font-size:16px;}
  .add-btn{background:none; border:1px dashed var(--brass); color:var(--brass); border-radius:9px; padding:10px; width:100%; cursor:pointer; font-size:14px; font-weight:600;}
  .submit-btn{
    width:100%; background:linear-gradient(135deg,var(--ember-bright),var(--ember)); color:#1c1815;
    border:none; border-radius:10px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px;
  }
  .submit-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .msg{display:none; border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:16px; line-height:1.6;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(124,154,111,0.12); border:1px solid rgba(124,154,111,0.35); color:var(--ok);}
  .msg.err{background:rgba(193,92,74,0.12); border:1px solid rgba(193,92,74,0.35); color:var(--err);}
  .loading-note{font-size:12.5px; color:var(--cream-dim);}
</style>
</head>
<body>
<div class="wrap">
  <h1>اطلب من elmo3ez</h1>
  <p class="sub">املي بياناتك واختاري الأصناف، وهنجهز طلبك على طول.</p>

  <div class="msg" id="msg"></div>

  <form id="orderForm">
    <div class="card">
      <label>الاسم بالكامل</label>
      <input type="text" id="name" required>
      <label>رقم التليفون</label>
      <input type="tel" id="phone" required>
      <label>العنوان</label>
      <input type="text" id="address" required>
    </div>

    <div class="card">
      <label>الأصناف</label>
      <div id="itemsList"></div>
      <button type="button" class="add-btn" id="addItemBtn">+ إضافة صنف</button>
      <p class="loading-note" id="productsStatus">بيجيب قائمة المنتجات…</p>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">تأكيد الطلب</button>
  </form>
</div>

<script>
let products = [];
const itemsList = document.getElementById('itemsList');
const addItemBtn = document.getElementById('addItemBtn');
const productsStatus = document.getElementById('productsStatus');
const form = document.getElementById('orderForm');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

function showMsg(text, type){
  msg.textContent = text;
  msg.className = 'msg show ' + type;
}

function productOptionsHtml(selectedId){
  return products.map(p =>
    `<option value="${p.variant_id}" ${p.variant_id === selectedId ? 'selected' : ''}>${p.title} — ${p.price} ج.م</option>`
  ).join('');
}

function addItemRow(){
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <select class="product-select">${productOptionsHtml()}</select>
    <input type="number" class="qty-input" value="1" min="1">
    <button type="button" class="remove-btn">×</button>
  `;
  row.querySelector('.remove-btn').addEventListener('click', () => row.remove());
  itemsList.appendChild(row);
}

addItemBtn.addEventListener('click', addItemRow);

async function loadProducts(){
  try{
    const res = await fetch('/api/get-products');
    if(!res.ok) throw new Error('server error');
    products = await res.json();
    if(!products.length){
      productsStatus.textContent = 'مفيش منتجات ظاهرة دلوقتي — تأكد إن المتجر فيه منتجات منشورة.';
      return;
    }
    productsStatus.textContent = '';
    addItemRow();
  }catch(err){
    productsStatus.textContent = 'مش قادر يجيب قائمة المنتجات دلوقتي. جرب تحدّث الصفحة.';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.classList.remove('show');

  const rows = [...itemsList.querySelectorAll('.item-row')];
  if(rows.length === 0){
    showMsg('ضيفي صنف واحد على الأقل.', 'err');
    return;
  }
  const items = rows.map(r => ({
    variant_id: r.querySelector('.product-select').value,
    quantity: parseInt(r.querySelector('.qty-input').value, 10) || 1
  }));

  const payload = {
    name: document.getElementById('name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    address: document.getElementById('address').value.trim(),
    items
  };

  submitBtn.disabled = true;
  submitBtn.textContent = 'بيتم التأكيد…';

  try{
    const res = await fetch('/api/create-draft-order', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || 'حصل خطأ');
    showMsg('تم إنشاء طلبك بنجاح! هنتواصل معاك للتأكيد.', 'ok');
    form.reset();
    itemsList.innerHTML = '';
    addItemRow();
  }catch(err){
    showMsg('حصل خطأ في إرسال الطلب: ' + err.message, 'err');
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'تأكيد الطلب';
  }
});

loadProducts();
</script>
</body>
</html>
